name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexo
          POSTGRES_PASSWORD: nexo
          POSTGRES_DB: nexo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Migrações com o papel dono; aplicação e testes com nexo_app (sem superusuário, sem BYPASSRLS).
      DATABASE_MIGRATION_URL: postgresql://nexo:nexo@localhost:5432/nexo
      DATABASE_URL: postgresql://nexo_app:nexo_app_ci@localhost:5432/nexo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build -w @nexo/core
      - run: npm run typecheck
      - name: Migrações e papel da aplicação
        run: |
          npm run db:deploy -w @nexo/api
          npm run db:setup-local -w @nexo/api
          npm run queue:setup -w @nexo/api
      - run: npm test
      - run: npm run build
      - name: Auditoria de dependências (falha em alta ou crítica)
        run: npm audit --audit-level=high

  image:
    # A imagem de produção precisa construir (Dockerfile). Não publica em lugar nenhum.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nexo-crm:ci .
      - name: A imagem tem o painel e a API e não roda como root
        run: |
          docker run --rm nexo-crm:ci test -f apps/web/dist/index.html
          docker run --rm nexo-crm:ci test -f apps/api/dist/main.js
          docker run --rm nexo-crm:ci whoami | grep -qx node

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificação de segredos (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
