# Postgres só para desenvolvimento local. Porta ligada apenas em 127.0.0.1.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: nexo
      POSTGRES_DB: nexo
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - nexo-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexo']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nexo-db:
